<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { margin-bottom: 30px; }
        
        .galeria {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        .galeria img {
            height: 250px;
            width: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
            object-fit: cover;
            background-color: #2a2a2a; /* Cor de fundo enquanto carrega */
        }

        .galeria img:hover {
            transform: scale(1.05);
        }
        
        .mensagem {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Minha Galeria</h1>
    
    <div class="galeria" id="galeria">
        <p class="mensagem" id="status">Buscando imagens no repositório...</p>
    </div>

    <script>
        const githubUser = 'gamerx766';     
        const githubRepo = 'vitao';  
        const pasta = 'images';                   


        const galeria = document.getElementById('galeria');
        const status = document.getElementById('status');

        async function carregarImagens() {
            try {
               
                const url = `https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${pasta}`;
                const resposta = await fetch(url);
                
                if (!resposta.ok) {
                    throw new Error('Não foi possível ler a pasta. Verifique o usuário e o repositório.');
                }
                
                const arquivos = await resposta.json();
                galeria.innerHTML = '';

                const extensoesValidas = ['.jpg', '.jpeg', '.png', '.gif', '.webp'];
                let imagensEncontradas = 0;

                arquivos.forEach(arquivo => {
                   
                    const nomeArquivo = arquivo.name.toLowerCase();
                    const isImagem = extensoesValidas.some(ext => nomeArquivo.endsWith(ext));
                    
                    if (isImagem) {
                        imagensEncontradas++;
                        
                        const img = document.createElement('img');
                        
                        img.src = arquivo.download_url; 
                        img.alt = arquivo.name;
                        img.loading = 'lazy'; 
                        
                        galeria.appendChild(img);
                    }
                });

                if (imagensEncontradas === 0) {
                    galeria.innerHTML = '<p class="mensagem">Nenhuma imagem encontrada na pasta.</p>';
                }

            } catch (erro) {
                galeria.innerHTML = `<p class="mensagem" style="color: #ff6b6b;">Erro: ${erro.message}</p>`;
            }
        }

        carregarImagens();
    </script>
</body>
</html>
